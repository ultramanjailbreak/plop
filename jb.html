<!doctype html>
<html lang="en" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Game House</title>
    <style>
      html{
    background-image: url('img.jpg');
    background-position: center;
    background-size: cover;
    background-attachment: fixed;
    background-repeat: no-repeat;
    background-color: #24272b;
    color: grey;
    text-align: center;
    overflow: hidden;
      }
      
      body {
        font:
          15px/1.45 "Segoe UI",
          system-ui,
          sans-serif;
      }
      #brand {
        text-align: center;
      
      }
#brand {
        text-align: center;
        padding: 8px 10px;
  background-image: url('IMG_0051-1080x1920 2.jpg');
    background-position: center;
    background-size: cover;
    background-attachment: fixed;
    background-repeat: no-repeat;
    color: grey;
    text-align: center;
    overflow: hidden;
      }
      #brand img {
        width: 28px;
        height: 28px;
        margin-right: 8px;
        border-radius: 50%;
        vertical-align: middle;
      }
      #brand b {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: #e6ebf2;
        vertical-align: middle;
      }
      /* running: a spinner under the brand. jb.js sets body.done / body.fail / body.log. */
      
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-size: 16px;
        letter-spacing: 0.5px;
        display: none;
      }
      #wrap {
        padding: 0;
      }
      #state,
      #out {
        display: none;
      }

      body.done #spin {
        display: none;
      }
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
      }

      /* ?log=1 -- the full step log, styled like the landing. */
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        padding: 14px 18px;
      }
      body.log #state {
        display: block;
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 8px;
      }
      .ok {
        color: #7fd0a0;
      }
      .bad {
        color: #d08a7f;
      }
      .warn {
        color: #d8c07f;
      }
      .safe {
        color: #7fd0a0;
      }
      .danger {
        color: #d08a7f;
      }
      code {
        color: #9fb3d0;
      }
    </style>
  </head>
  <body>
    <div id="brand">
      <img
        src="logo_raw.png"
        alt=""
        width="28"
        height="28"
      /><b>Game House</b>
    </div>
    <div id="spin"></div>
    <div id="msg">Restart your console</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <script type="module">
      import "./jb.js?v=10";
    </script>
  </body>
</html>
